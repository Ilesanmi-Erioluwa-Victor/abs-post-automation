name: Automation Tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: production
      APP_TIMEZONE: ${{ secrets.APP_TIMEZONE }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      POST_PROVIDER_NAME: abs-tech-connect
      POST_PROVIDER_ENDPOINT: ${{ secrets.POST_PROVIDER_ENDPOINT }}
      POST_PROVIDER_TOKEN: ${{ secrets.POST_PROVIDER_TOKEN }}
      POST_PROVIDER_VISIBILITY_TYPE: Everyone
      POST_RETRY_LIMIT: 5
      SESSION_MORNING_HOUR: 8
      SESSION_AFTERNOON_HOUR: 14
      SESSION_EVENING_HOUR: 20
      SESSION_POST_LIMIT: 6
      SESSION_POST_INTERVAL_MINUTES: 12
      POST_BATCH_LIMIT: 6
      CANVAS_WIDTH: 1080
      CANVAS_HEIGHT: 1350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install canvas build libraries
        run: sudo apt-get update && sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations
        run: npm run prisma:migrate:deploy

      - name: Run tick
        run: npm run tick
