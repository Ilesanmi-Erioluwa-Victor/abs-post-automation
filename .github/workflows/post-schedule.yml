name: Idiom Bot Scheduler

on:
  schedule:
    - cron: "0 8 * * *"   # 09:00 WAT / 08:00 UTC
    - cron: "0 11 * * *"  # 12:00 WAT / 11:00 UTC
    - cron: "0 14 * * *"  # 15:00 WAT / 14:00 UTC
    - cron: "0 17 * * *"  # 18:00 WAT / 17:00 UTC
    - cron: "0 20 * * *"  # 21:00 WAT / 20:00 UTC
    - cron: "0 23 * * *"  # 00:00 WAT (next day) / 23:00 UTC
  workflow_dispatch:
    inputs:
      slot:
        description: "Batch slot (WAT)"
        type: choice
        options:
          - 9am
          - 12pm
          - 3pm
          - 6pm
          - 9pm
          - 12am
        default: 9am
      count:
        description: "Number of posts in the batch"
        type: number
        default: 6

jobs:
  trigger-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Determine slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Keep the externally visible slot names in 12-hour Nigeria time.
            # The scheduler below is UTC because GitHub Actions cron has no
            # timezone option; only this internal mapping uses 24-hour UTC.
            echo "slot=${{ inputs.slot }}" >> "$GITHUB_OUTPUT"
            echo "count=${{ inputs.count || 6 }}" >> "$GITHUB_OUTPUT"
          else
            # Map from the cron expression that triggered this run (not the
            # wall-clock hour) so GitHub scheduling delays can't mislabel
            # the slot. Nigeria uses WAT (UTC+01:00) year-round, so the
            # 23:00 UTC trigger is 12:00am WAT on the following day.
            case "${{ github.event.schedule }}" in
              "0 8 * * *") echo "slot=9am" >> "$GITHUB_OUTPUT" ;;
              "0 11 * * *") echo "slot=12pm" >> "$GITHUB_OUTPUT" ;;
              "0 14 * * *") echo "slot=3pm" >> "$GITHUB_OUTPUT" ;;
              "0 17 * * *") echo "slot=6pm" >> "$GITHUB_OUTPUT" ;;
              "0 20 * * *") echo "slot=9pm" >> "$GITHUB_OUTPUT" ;;
              "0 23 * * *") echo "slot=12am" >> "$GITHUB_OUTPUT" ;;
              *)  echo "slot=9am" >> "$GITHUB_OUTPUT" ;;
            esac
            echo "count=6" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger batch
        env:
          BOT_URL: ${{ secrets.BOT_TRIGGER_URL }}
          BOT_TOKEN: ${{ secrets.TRIGGER_AUTH_TOKEN }}
        run: |
          BOT_URL="$(printf '%s' "$BOT_URL" | tr -d '\r\n\t ')"
          echo "Resolved BOT_URL length: ${#BOT_URL}"
          curl -sS -X POST "${BOT_URL}/run-batch" \
            -H "Authorization: Bearer ${BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"count\": ${{ steps.slot.outputs.count }}, \"slot\": \"${{ steps.slot.outputs.slot }}\"}" \
            --max-time 120
